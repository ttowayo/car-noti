<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동차 경고등 색으로 구분하기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>자동차 경고등 색으로 구분하기</h1>
        </header>

        <!-- 검색 섹션 -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="경고등 이름으로 검색...">
                <button id="searchBtn">검색</button>
            </div>
        </section>

        <!-- 색상별 설명 섹션 -->
        <section class="level-info-section">
            <div class="level-card level4">
                <div class="level-header">
                    <span class="level-color red"></span>
                    <h2>경고(빨간색)</h2>
                </div>
                <p>매우 위험한 신호. 비상상황, 긴급조치, 주행 위험 상황을 의미함. 반드시 주행을 멈추고 가까운 정비소에 방문해 차량을 점검해야 하는 상황</p>
            </div>

            <div class="level-card level3">
                <div class="level-header">
                    <span class="level-color orange"></span>
                    <h2>주의(주황색)</h2>
                </div>
                <p>주의 신호. 운행은 가능하지만 향후 차량에 문제가 생길 수 있으니 주의가 필요한 상황</p>
            </div>

            <div class="level-card level2">
                <div class="level-header">
                    <span class="level-color green"></span>
                    <h2>상태(초록색)</h2>
                </div>
                <p>방향 지시등이나 헤드 램프 등 자동차 운행과 작동 상태를 나타내는 상황</p>
            </div>

            <div class="level-card level1">
                <div class="level-header">
                    <span class="level-color blue"></span>
                    <h2>상태주의(파란색)</h2>
                </div>
                <p>장치가 작동 중이지만 타인에게 불편을 줄 수 있으니 주의가 필요한 상황</p>
            </div>
        </section>

        <!-- 필터 버튼 -->
        <section class="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-level="all">전체</button>
                <button class="filter-btn" data-level="level4">경고(빨간색)</button>
                <button class="filter-btn" data-level="level3">주의(주황색)</button>
                <button class="filter-btn" data-level="level2">상태(초록색)</button>
                <button class="filter-btn" data-level="level1">상태주의(파란색)</button>
            </div>
        </section>

        <!-- 경고등 목록 -->
        <section class="warnings-section">
            <div id="warningsList" class="warnings-grid">
                <!-- 경고등 카드들이 여기에 동적으로 생성됩니다 -->
            </div>
            <div id="noResults" class="no-results" style="display: none;">
                검색 결과가 없습니다.
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
